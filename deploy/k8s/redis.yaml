apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app: redis }
spec:
  selector: { app: redis }
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl"]
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 640Mi }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
