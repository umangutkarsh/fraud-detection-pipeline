apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-processor
  labels: { app: fraud-processor }
spec:
  replicas: 3
  selector:
    matchLabels: { app: fraud-processor }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: fraud-processor }
    spec:
      terminationGracePeriodSeconds: 30 # pipeline drains in-flight messages on SIGTERM
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: fraud-processor }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: fraud-processor
          image: fraud-processor
          args:
            - -brokers=kafka-0.kafka.fraud.svc.cluster.local:9092
            - -redis=redis.fraud.svc.cluster.local:6379
            - -workers=16
            - -metrics-addr=:2112
          ports:
            - name: metrics
              containerPort: 2112
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-processor
  labels: { app: fraud-processor }
spec:
  selector: { app: fraud-processor }
  ports:
    - name: metrics
      port: 2112
      targetPort: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-processor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-processor
  minReplicas: 3
  maxReplicas: 6 # = topic partitions; more replicas would sit idle
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraud-processor
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: fraud-processor }
